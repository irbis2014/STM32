name: Compile STM32

on:
  push:
    branches: [ '*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Build firmware
        run: |
          mkdir -p Firmware
          cp *.ino Firmware/Firmware.ino

          U1="https://github.com"
          U2="/BoardManagerFiles/raw/main"
          U3="/package_stmicroelectronics_index.json"
          URL="${U1}${U2}${U3}"

          arduino-cli core update-index --additional-urls "$URL"
          arduino-cli core install STMicroelectronics:stm32 --additional-urls "$URL"

          if [ -f libs.txt ]; then
            while IFS= read -r lib || [ -n "$lib" ]; do
              lib=$(echo "$lib" | tr -d '\r' | xargs)
              if [ -n "$lib" ]; then
                arduino-cli lib install "$lib"
              fi
            done < libs.txt
          fi

          arduino-cli compile --fqbn STMicroelectronics:stm32:GenF1:pnum=BLUEPILL_F103C8 --output-dir ./build Firmware

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.ref_name }}
          path: build/*
