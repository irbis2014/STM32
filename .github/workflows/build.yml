name: Compile STM32

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Build firmware
        env:
          ARDUINO_BOARD_MANAGER_ADDITIONAL_URLS: https://github.com/stm32duino/BoardManagerFiles/raw/main/package_stmicroelectronics_index.json
        run: |
          mkdir -p Blink
          cp Blink.ino Blink/Blink.ino
          arduino-cli core update-index
          arduino-cli core install STMicroelectronics:stm32
          arduino-cli compile --fqbn STMicroelectronics:stm32:GenF1:pnum=BLUEPILL_F103C8 --output-dir ./build Blink

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: stm32-firmware
          path: build/*
